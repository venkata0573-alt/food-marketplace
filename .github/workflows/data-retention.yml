name: Data retention

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  retention:
    name: Run retention jobs
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retention — orders / auth logs / identity docs
        run: pnpm --filter @food-marketplace/jobs retention:all
