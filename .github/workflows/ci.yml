name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      STRIPE_SECRET_KEY: sk_test_ci_secret
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_publishable
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify migration down pairs
        run: pnpm --filter @food-marketplace/db verify:migrations
      - name: Unit tests
        run: pnpm test
      - name: Env boot validation (apps)
        run: |
          pnpm --filter @food-marketplace/web validate-env
          pnpm --filter @food-marketplace/admin validate-env
      - name: Next.js production build (web)
        run: |
          set -o pipefail
          pnpm --filter @food-marketplace/web build 2>&1 | tee /tmp/next-build.log
      - name: Performance budgets (vitals + API harness)
        run: pnpm perf:check
      - name: Bundle size budget
        run: |
          SHARED=$(grep -Eo 'First Load JS shared by all[[:space:]]+[0-9.]+' /tmp/next-build.log | awk '{print $NF}')
          FIRST_LOAD_JS_SHARED_KB="$SHARED" SKIP_BUNDLE_REBUILD=1 node scripts/perf/check-bundle-budget.mjs
