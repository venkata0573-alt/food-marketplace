name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_ENV: preview
  PREVIEW_DATABASE_BRANCH: pr-${{ github.event.pull_request.number }}

jobs:
  preview:
    name: Preview + isolated DB branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create isolated Postgres branch (Neon / provider)
        run: |
          echo "Create DB branch: ${PREVIEW_DATABASE_BRANCH}"
          echo "Wire DATABASE_URL from your provider API (Neon, Supabase branch, etc.)."
          # Example: neonctl branches create --name "${PREVIEW_DATABASE_BRANCH}" --parent main

      - name: Migrate + seed preview database
        run: |
          pnpm --filter @food-marketplace/db seed
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

      - name: Deploy preview (Vercel)
        run: |
          echo "Deploy apps/web with APP_ENV=preview and branch-scoped DATABASE_URL."
          # vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL
        uses: actions/github-script@v9
        with:
          script: |
            const url = process.env.PREVIEW_URL || 'https://preview.example.vercel.app';
            const body = `### Preview deploy\n- URL: ${url}\n- DB branch: \`${{ env.PREVIEW_DATABASE_BRANCH }}\` (seeded)\n`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
