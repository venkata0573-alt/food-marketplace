# Layer 2 local sandbox — Docker Compose
# Production data never belongs here. See docs/sandbox-and-local-isolation.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: food-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_marketplace
    ports:
      - '54322:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d food_marketplace']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: food-marketplace-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: food-marketplace-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: food-marketplace-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/food-photos &&
      mc anonymous set download local/food-photos &&
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: food-marketplace-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

  stripe-cli:
    image: stripe/stripe-cli:v1.24.0
    container_name: food-marketplace-stripe-cli
    restart: unless-stopped
    depends_on:
      - mailpit
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
    command:
      - listen
      - --forward-to
      - host.docker.internal:3000/api/webhooks/stripe
      - --skip-verify
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  redis_data:
  minio_data:
